[package]
name = "cursive"
version = "0.0.0"
description = "Cursive - a Markdown editor for notes, presentations and tutorials"
authors = ["Leon"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name
# on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cursive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
